# Runnable demonstration course. Copy this file to customize its topic and learning goals.
course_context:
  title: Create a clear GitHub issue in 20 minutes
  audience: Someone new to GitHub issues.
  prerequisites:
    - Access to a practice repository on GitHub with issues enabled.
    - No knowledge of Git, branches, or pull requests is required.
  learning_goal: >-
    Understand what a GitHub issue records and write a clear issue that another person
    can act on.
  assignment: >-
    Draft a GitHub issue about a README setup instruction that does not explain which
    folder to run a command from. Describe the unclear instruction, the clarification
    needed, and how to recognize that the documentation has been fixed.
  time_budget_minutes: 20
  completion_criteria: >-
    Finish with a specific title and an actionable issue description. A completed draft
    is sufficient; posting is optional and should be limited to the practice repository.
guide_structure:
  sections:
    - id: SEC-01
      title: Understand and outline a GitHub issue
      map_location: First 8 minutes of the 20-minute course, before writing the full issue.
      purpose: >-
        Explain how a GitHub issue records a problem for others to act on, then help
        the learner outline an issue about an unclear README setup instruction.
      topics:
        - The purpose of a GitHub issue and the role of a README as project instructions.
        - The observed problem, the expected result, and details that help someone investigate.
        - A clear completion check that tells the reader when the documentation is fixed.
      assignment_connection: >-
        Prepare notes for the course assignment: a GitHub issue about a README setup
        command whose working folder is unspecified. These notes become the full
        issue draft in SEC-02. No Git, branch, or pull request knowledge is needed.
      activity: >-
        In 4 minutes, outline the README issue using four labeled notes: problem,
        expected result, supporting details, and completion check. Use the fictional
        setup instruction from the worked example. Describe only what the example
        establishes; do not invent an error message or a command result.
      layout:
        - >-
          2 minutes — Explain an issue and a README in plain language. Show this text
          sequence: observe a problem -> outline it -> write the issue -> check clarity.
          Identify outlining as this section's task.
        - >-
          2 minutes — Provide a short worked example labeled as fictional. The README
          says "Run the setup command" without naming the folder. Show the problem
          (the reader cannot tell where to run it), expected result (the instructions
          name the folder), supporting detail (the quoted instruction in the Setup
          section), and completion check (a new reader can identify the folder).
        - >-
          4 minutes — Present the four-note outline activity. End by asking the learner
          to check that each note describes the same README problem and keep the
          outline for SEC-02. A written outline is the deliverable for this section.
    - id: SEC-02
      title: First application
      map_location: After orientation
      purpose: Apply one idea from the map to a small task.
      topics:
        - Choosing a relevant idea
        - Checking the result
      assignment_connection: Use the idea on a small part of the assigned task.
      activity: Try the idea, then explain what happened.
      layout:
        - Worked example
        - Practice prompt
        - Reflection
section_template:
  required_blocks:
    - order: 1
      name: Location
      instruction: Explain where this section fits in the course map.
    - order: 2
      name: Practice
      instruction: Give the learner one small action to try.
