[project]
name = "java-quickstart-generator"
version = "0.1.0"
description = "Generate a modular Java quickstart guide with the OpenAI Codex SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-codex>=0.170.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
java-quickstart-generator = "java_quickstart_generator.__main__:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
